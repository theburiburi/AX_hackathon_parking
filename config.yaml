# 실행 설정. 카메라별 보정값은 cameras.yaml에서 관리합니다.
detection:
  enabled: true
  model: models/detection/yolo11s.pt
  confidence: 0.3
  iou: 0.5
  image_size: 640
  detect_every_n_frames: 3
  entry_camera: cam01
  global_id_max_distance: 90
  global_id_max_missed_updates: 30
  vehicle_classes:
  - 2
  - 5
  - 7
  tracker: bytetrack.yaml
  device: auto
