local_tracking:

  # =======================================================
  # LOCAL ID MATCHING
  # =======================================================

  # 이전 프레임 차량과 현재 detection의 중심점이 이 거리(px) 이내면 같은 차량으로 매칭할 수 있음.
  match_distance_px: 55.0

  # 차량 bbox 대각선 길이에 비례해서 Local ID 매칭 허용 거리를 추가로 결정하는 비율.
  match_distance_bbox_ratio: 0.40

  # 이전 bbox와 현재 bbox가 이 IoU 이상 겹치면 같은 차량일 가능성을 높게 봄.
  match_iou_threshold: 0.12


  # =======================================================
  # MOTION DETECTION
  # =======================================================

  # 현재 위치와 약 몇 초 전 위치를 비교해서 차량의 이동량을 판단할지 정함.
  motion_window_sec: 0.8

  # 차량이 움직였다고 보기 위해 반드시 넘어야 하는 최소 이동거리(px).
  # 기존 14px보다 조금 더 엄격하게 올림.
  min_motion_px: 16.0

  # 차량 bbox 대각선 길이에 이 값을 곱해서 차량 크기별 이동 threshold를 계산함.
  # 큰 차량도 bbox 흔들림만으로 ACTIVE가 되지 않도록 조금 더 강화.
  motion_bbox_ratio: 0.080

  # bbox bottom-center 위치를 최근 몇 프레임 median으로 부드럽게 만들지 결정함.
  # 값이 커질수록 bbox 순간 흔들림에는 강해지지만 반응은 조금 느려짐.
  smoothing_window: 9


  # =======================================================
  # UNKNOWN -> ACTIVE
  # =======================================================

  # 처음부터 있던 차량이 이 시간 동안 계속 움직임 조건을 만족해야 최초 ACTIVE로 인정함.
  # 가만히 있는 차량이 bbox 흔들림으로 ACTIVE가 되는 것을 막기 위해 강화.
  unknown_to_active_sec: 1.20


  # =======================================================
  # ACTIVE -> STOPPED
  # =======================================================

  # ACTIVE 차량이 이 시간 동안 연속으로 움직이지 않아야 STOPPED로 내려감.
  # 이미 ACTIVE로 확정된 차량은 너무 쉽게 STOPPED가 되지 않도록 약간 완화.
  active_to_stopped_sec: 0.80


  # =======================================================
  # STOPPED -> ACTIVE
  # =======================================================

  # STOPPED에서는 기본 움직임 threshold에 이 배수를 곱해 더 확실한 움직임만 인정함.
  stopped_motion_multiplier: 2.5

  # STOPPED 차량이 움직임 조건을 이 시간 동안 계속 만족해야 다시 ACTIVE가 됨.
  stopped_to_active_sec: 1.00


  # =======================================================
  # STOPPED -> PARKED
  # =======================================================

  # STOPPED 상태에서 같은 위치에 이 시간 이상 머물러야 PARKED로 확정함.
  parked_after_sec: 5.0

  # STOPPED 차량이 정지 기준점 주변에서 흔들려도 허용할 최소 반경(px).
  stop_anchor_min_px: 14.0

  # 차량 bbox 크기에 비례해서 STOPPED 위치 흔들림 허용 반경을 계산하는 비율.
  stop_anchor_bbox_ratio: 0.10


  # =======================================================
  # PARKED -> ACTIVE
  # =======================================================

  # PARKED에서는 기본 움직임 threshold에 이 배수를 곱해 출차 움직임을 더 엄격하게 판단함.
  # UNKNOWN -> ACTIVE와 비슷한 수준으로 어렵게 만들기 위해 유지/강화.
  parked_motion_multiplier: 3.0

  # PARKED 차량이 움직임 조건을 이 시간 동안 유지해야 다시 ACTIVE로 전환됨.
  # UNKNOWN -> ACTIVE와 같은 수준으로 맞춤.
  parked_to_active_sec: 1.20

  # PARKED 확정 위치에서 최소 이 거리(px) 이상 벗어나야 출차 가능성이 있다고 판단함.
  # 작은 bbox 흔들림으로 ACTIVE가 되는 것을 막기 위해 강화.
  parked_exit_min_px: 28.0

  # 차량 bbox 대각선 길이에 이 값을 곱해 PARKED 위치 이탈 기준을 계산함.
  parked_exit_bbox_ratio: 0.16


  # =======================================================
  # TRACK MANAGEMENT
  # =======================================================

  # detection이 이 시간 이상 사라지면 해당 Local ID를 삭제함.
  max_missing_sec: 1.5

  # 영상의 기준 FPS이며 프레임 간 시간과 Local ID 매칭 거리 계산에 사용함.
  nominal_fps: 30.0


  # =======================================================
  # DISPLAY / DEBUG
  # =======================================================

  # UNKNOWN 차량도 bbox를 표시할지 결정함.
  # 현재 src/detection/run_detection_all.py 화면에서만 사용하며,
  # server.py / 웹 뷰어는 이 값을 사용하지 않음.
  show_unknown: true

  # UNKNOWN -> ACTIVE 같은 상태 전이 로그를 콘솔에 출력할지 결정함.
  # server.py에서는 현재 False로 강제하므로 run_detection_all.py에서만 적용됨.
  print_transitions: false