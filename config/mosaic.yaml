# 모자이크 원본 영상의 칸 배치 (모든 원본 영상에 공통).
#
# 원본: data/videos/raw/<영상 제목>.mp4
# 각 칸을 잘라 카메라 1대로 취급한다.
# 모든 카메라가 같은 프레임에서 잘리므로 프레임 번호가 항상 일치한다.
#
# cell: [행, 열] (1부터, 왼쪽 위가 [1, 1])
# roi : (선택) 칸 안의 실제 화면 영역 [x, y, width, height], 칸 기준 픽셀.
#       4:3 카메라처럼 좌우 검은 여백을 빼고 싶을 때 지정한다.
#       지정하지 않으면 칸 전체를 사용한다.
#       roi를 바꾸면 카메라 좌표가 달라지므로
#       preprocess와 calibration을 모두 다시 해야 한다.

grid:
  rows: 3
  cols: 3

cameras:
  - id: cam01
    cell: [1, 1]

  - id: cam02
    cell: [1, 2]

  - id: cam03
    cell: [1, 3]

  - id: cam05
    cell: [2, 1]

  - id: cam06
    cell: [2, 2]

  - id: cam07
    cell: [2, 3]

  - id: cam08
    cell: [3, 1]

# 차량이 없을 때 일부 카메라는 화면 전체를 가로로 압축하고 좌우를 검게 채운다 (축소 모드).
#   축소 모드 x = scale_x * 전체 화면 x + offset_x   (y는 같다)
# tracking / calibration은 전체 화면 좌표를 쓰므로 축소 모드 검출은 이 식으로 되돌린다.
# test02의 7개 카메라 모두 두 모드 프레임 정합 결과가 같았다 (0.824~0.826, 113~115).
# 프레임별 모드는 scripts/detect_view_modes.py 가 data/detections/<title>/view_modes.json 에 기록한다.
letterbox:
  scale_x: 0.825
  offset_x: 113.0
