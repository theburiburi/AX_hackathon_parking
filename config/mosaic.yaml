# 모자이크 원본 영상의 칸 배치 (모든 원본 영상에 공통).
#
# 원본: data/videos/raw/<영상 제목>.mp4
# 각 칸을 잘라 카메라 1대로 취급한다.
# 모든 카메라가 같은 프레임에서 잘리므로 프레임 번호가 항상 일치한다.
#
# cell: [행, 열] (1부터, 왼쪽 위가 [1, 1])
# roi : (선택) 칸 안의 실제 화면 영역 [x, y, width, height], 칸 기준 픽셀.
#       4:3 카메라처럼 좌우 검은 여백을 빼고 싶을 때 지정한다.
#       지정하지 않으면 칸 전체를 사용한다.
#       roi를 바꾸면 카메라 좌표가 달라지므로
#       preprocess와 calibration을 모두 다시 해야 한다.

grid:
  rows: 3
  cols: 3

cameras:
  - id: cam01
    cell: [1, 1]

  - id: cam02
    cell: [1, 2]

  - id: cam03
    cell: [1, 3]

  - id: cam05
    cell: [2, 1]

  - id: cam06
    cell: [2, 2]

  - id: cam07
    cell: [2, 3]

  - id: cam08
    cell: [3, 1]
