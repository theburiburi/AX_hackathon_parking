# 차단기 입출차 자동 감지 설정 (scripts/detect_gate_events.py)
#
# 입차용 / 출차용 네모 감지 박스를 따로 둔다.
# 박스 넓이 중 차량 bbox와 겹친 비율이 min_overlap_ratio보다 크고,
# 그때 진행 방향이 박스의 direction과 맞으면 이벤트로 기록한다.
#
# 좌표는 카메라 칸 기준 픽셀 (cam01: 640 x 360, 왼쪽 위 = 0, 0).
# 박스 위치를 확인 / 조정할 때는 --preview 로 박스를 그린 이미지를 만든다.
#
# 박스 정의: box: [x1, y1, x2, y2] (왼쪽 위, 오른쪽 아래. 차량 bbox와 같은 형식)

camera_id: cam01

gate:
  id: GATE-01
  name: 정문 차단기

zones:
  # 입차: 바깥(화면 위쪽 도로)에서 들어와 차단기(왼쪽 차로)를 지나
  #       주차장 안쪽(화면 왼쪽 아래)으로 들어간 위치
  - type: IN
    label: 입차
    box: [160, 100, 230, 160]
    # 진행 방향 (영상 좌표, x 오른쪽 + / y 아래 +): 왼쪽 아래로 이동
    direction: [-1.0, 0.5]

  # 출차: 차단기(오른쪽 차로)를 지나 바깥(화면 위쪽 도로)으로 나가는 위치
  - type: OUT
    label: 출차
    box: [340, 140, 410, 200]
    # 진행 방향: 오른쪽 위로 이동
    direction: [1.0, -0.5]

# 박스 넓이 중 차량 bbox와 겹친 비율이 이 값보다 커야 겹친 것으로 본다 (0 ~ 1)
# (박스 넓이 기준이라 차량 크기와 관계없이 같은 기준)
# (test01 기준 0.3 ~ 0.5는 결과 같음, 0.2 이하는 입차 오검출 증가)
min_overlap_ratio: 0.3

# 박스와 연속으로 이 프레임 수 이상 겹쳐야 인정 (bbox 흔들림 방지)
min_frames_in_zone: 3

# 진행 방향 계산에 쓰는 시간 구간 (초)
direction_window_sec: 0.5

# direction 방향으로 이 속도(px/s) 이상 움직이고 있어야 인정
# (박스 안에 서 있는 차량 / 반대 방향 차량 제외)
min_speed_px_per_sec: 10.0
