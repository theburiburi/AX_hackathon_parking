# 차단기 입출차 자동 감지 설정 (scripts/detect_gate_events.py)
#
# 차량 위치(bbox 바닥 중앙점)가 구역(polygon)에 들어오고,
# 그때 진행 방향이 구역의 direction과 맞으면 이벤트로 기록한다.
#
# 좌표는 카메라 칸 기준 픽셀 (cam01: 640 x 360, 왼쪽 위 = 0, 0).
# 구역 위치를 확인 / 조정할 때는 --preview 로 구역을 그린 이미지를 만든다.

camera_id: cam01

gate:
  id: GATE-01
  name: 정문 차단기

zones:
  # 입차: 바깥(화면 위쪽 도로)에서 들어와 차단기(왼쪽 차로)를 지나
  #       주차장 안쪽(화면 왼쪽 아래)으로 들어간 위치
  - type: IN
    label: 입차
    polygon: [[70, 215], [180, 170], [215, 195], [100, 255]]
    # 진행 방향 (영상 좌표, x 오른쪽 + / y 아래 +): 왼쪽 아래로 이동
    direction: [-1.0, 0.5]

  # 출차: 차단기(오른쪽 차로)를 지나 바깥(화면 위쪽 도로)으로 나가는 위치
  - type: OUT
    label: 출차
    polygon: [[330, 95], [470, 105], [470, 140], [320, 128]]
    # 진행 방향: 오른쪽 위로 이동
    direction: [1.0, -1.0]

# 구역 안에 연속으로 이 프레임 수 이상 있어야 인정 (bbox 흔들림 방지)
min_frames_in_zone: 3

# 진행 방향 계산에 쓰는 시간 구간 (초)
direction_window_sec: 0.5

# direction 방향으로 이 속도(px/s) 이상 움직이고 있어야 인정
# (구역 안에 서 있는 차량 / 반대 방향 차량 제외)
min_speed_px_per_sec: 10.0
