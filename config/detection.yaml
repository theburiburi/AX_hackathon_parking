# 기본으로 사용할 원본 영상 제목 (data/videos/raw/<video>.mp4).
# server.py, calibrate_camera.py, play_mosaic.py의 기본값으로 사용된다.
# 칸 ↔ 카메라 배치는 config/mosaic.yaml 에서 관리한다.
video: test02

model:
  weights: yolo26x.pt
  device: 0

inference:
  imgsz: 960
  conf: 0.20
  iou: 0.70
  quantize: 16
  batch_size: 7

classes:
  names:
    - car
    - motorcycle
    - bus
    - truck
