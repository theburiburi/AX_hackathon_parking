model:
  weights: yolo26x.pt
  device: 0

inference:
  imgsz: 960
  conf: 0.20
  iou: 0.70

  # 16 = FP16
  # 32 = FP32
  quantize: 16

  # 한 번에 처리할 카메라 수
  batch_size: 7

classes:
  names:
    - car
    - motorcycle
    - bus
    - truck

videos:
  - camera_id: cam01
    path: data/videos/scene1/260914_1.mp4

  - camera_id: cam02
    path: data/videos/scene1/260914_2.mp4

  - camera_id: cam03
    path: data/videos/scene1/260914_3.mp4

  - camera_id: cam05
    path: data/videos/scene1/260914_5.mp4

  - camera_id: cam06
    path: data/videos/scene1/260914_6.mp4

  - camera_id: cam07
    path: data/videos/scene1/260914_7.mp4

  - camera_id: cam08
    path: data/videos/scene1/260914_8.mp4

display:
  # OpenCV 창 표시 여부
  show: false

  # BBOX drawing + resize + grid 생성 여부
  # 순수 분석 성능 측정 시 false
  render: false

  show_confidence: true
  line_width: 2

  grid_columns: 4
  width: 1600
  height: 850