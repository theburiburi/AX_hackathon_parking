model:
  weights: yolo26x.pt
  device: 0

inference:
  imgsz: 960
  conf: 0.20
  iou: 0.70

  # 16 = FP16
  # 32 = FP32
  quantize: 16

  # 7개 카메라의 동일 시점 프레임을
  # 하나의 batch로 처리
  batch_size: 7

classes:
  names:
    - car
    - motorcycle
    - bus
    - truck

videos:
  - camera_id: cam01
    path: data/videos/scene1/260914_1.mp4

  - camera_id: cam02
    path: data/videos/scene1/260914_2.mp4

  - camera_id: cam03
    path: data/videos/scene1/260914_3.mp4

  - camera_id: cam05
    path: data/videos/scene1/260914_5.mp4

  - camera_id: cam06
    path: data/videos/scene1/260914_6.mp4

  - camera_id: cam07
    path: data/videos/scene1/260914_7.mp4

  - camera_id: cam08
    path: data/videos/scene1/260914_8.mp4

pipeline:
  # 다음 synchronized frame set을
  # 몇 개까지 미리 준비할지
  #
  # 너무 크게 잡을 필요 없음.
  queue_size: 2

profile:
  # 몇 set마다 성능 출력
  print_interval: 100

display:
  # 현재는 순수 분석 성능 측정
  show: true
  render: true

  show_confidence: true
  line_width: 2

  grid_columns: 4
  width: 1600
  height: 850